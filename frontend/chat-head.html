<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="A focused conversation workspace for Synapse Aura." />
    <title>Synapse AI — Aura</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css" />
    <link rel="stylesheet" href="/css/styles.css?v=19" />
    <link rel="stylesheet" href="/css/chat.css?v=19" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  </head>

  <body class="chat-page">
    <div class="page-transition-overlay" id="page-overlay" aria-hidden="true"></div>
    <div class="chat-background" aria-hidden="true"></div>

    <input id="drawer-toggle" type="checkbox" aria-label="Toggle sidebar" />
    <label id="drawer-overlay" for="drawer-toggle" aria-label="Close sidebar"></label>

    <aside id="drawer" aria-label="Chat navigation">
      <a class="sidebar-brand" href="/index.html" aria-label="Synapse AI home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 5.6v5.1M12 13.3v5.1M6.7 17.5 12 13.3M17.3 17.5 12 13.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="12" cy="4.6" r="1.9" fill="currentColor" /><circle cx="5.4" cy="18.6" r="1.9" fill="currentColor" /><circle cx="18.6" cy="18.6" r="1.9" fill="currentColor" /><circle cx="12" cy="12" r="1.6" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-name">Synapse <em>AI</em></span>
      </a>

      <nav class="sidebar-primary" aria-label="Primary navigation">
        <button id="nav-new-chat-btn" class="sidebar-action sidebar-action--new" type="button">
          <span class="material-symbols-outlined">edit_square</span>
          <span>New chat</span>
        </button>

      </nav>

      <section class="sidebar-history" aria-label="Recent conversations">
        <span class="sidebar-section-label">Recent</span>
        <ul id="history-list" aria-live="polite"></ul>
        <p class="sidebar-empty">Your recent conversations are available in chat history.</p>
      </section>

      <div class="sidebar-bottom">
        <div class="sidebar-divider"></div>
        <button id="settings-btn" class="sidebar-action" type="button">
          <span class="material-symbols-outlined">tune</span>
          <span>Personalize Aura</span>
        </button>
        <button id="logout-btn" class="sidebar-action sidebar-action--logout" type="button">
          <span class="material-symbols-outlined">logout</span>
          <span>Log out</span>
        </button>
      </div>
    </aside>

    <main class="chat-workspace">
      <header class="chat-header">
        <div class="header-side">
          <label class="mobile-menu-btn" for="drawer-toggle" aria-label="Open sidebar">
            <span class="material-symbols-outlined">menu</span>
          </label>
          <button id="header-logo" type="button" aria-label="Start a new chat">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 5.6v5.1M12 13.3v5.1M6.7 17.5 12 13.3M17.3 17.5 12 13.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                <circle cx="12" cy="4.6" r="1.9" fill="currentColor" /><circle cx="5.4" cy="18.6" r="1.9" fill="currentColor" /><circle cx="18.6" cy="18.6" r="1.9" fill="currentColor" /><circle cx="12" cy="12" r="1.6" fill="currentColor" />
              </svg>
            </span>
            <span class="brand-name">Synapse</span>
          </button>

          <div class="model-selector-wrap" id="model-selector-container">
            <button id="model-selector-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="current-model-name">Aura Allrounder</span>
              <span class="material-symbols-outlined">expand_more</span>
            </button>
            <div id="model-dropdown" class="hidden opacity-0 translate-y-2 pointer-events-none" role="listbox" aria-label="Choose an AI model">
                <button class="model-option" type="button" data-model="minimax/minimax-m2.7" data-name="Aura AI" role="option">
                  <span class="material-symbols-outlined">auto_awesome</span>
                  <span><span class="model-option-title">Aura AI</span><span class="model-option-description">Thoughtful help for everyday work</span></span>
                  <span class="material-symbols-outlined model-active-check">check</span>
                </button>

                <button class="model-option" type="button" data-model="openai/gpt-oss-120b" data-name="Aura Summary" role="option">
                  <span class="material-symbols-outlined">short_text</span>
                  <span><span class="model-option-title">Aura Summary</span><span class="model-option-description">Clear explanations, in two languages</span></span>
                  <span class="material-symbols-outlined model-active-check">check</span>
                </button>
                <button class="model-option" type="button" data-model="nvidia/nemotron-3.5-lightning-30b-a3b" data-name="Aura Bhai" role="option">
                  <span class="material-symbols-outlined">bolt</span>
                  <span><span class="model-option-title">Aura Bhai</span><span class="model-option-description">Fast, casual help in Hinglish</span></span>
                  <span class="material-symbols-outlined model-active-check">check</span>
                </button>
            </div>
          </div>

          <div id="aura1-mode-toggle" aria-label="Allrounder response mode" role="group">
            <button id="mode-deep-think-btn" type="button" data-active="true" aria-pressed="true">Think</button>
            <button id="mode-fast-btn" type="button" aria-pressed="false">Fast</button>
          </div>
        </div>

        <div class="header-side">
          <button id="personality-badge" class="hidden" type="button" title="Change Aura's personality">
            <span class="material-symbols-outlined">psychology</span>
            <span id="personality-badge-name">Default</span>
          </button>
          <button class="header-icon-button" id="header-settings-btn" type="button" aria-label="Personalize Aura" onclick="document.getElementById('settings-btn').click()">
            <span class="material-symbols-outlined">tune</span>
          </button>
          <button id="user-avatar" class="avatar-button" type="button" aria-label="Your profile"></button>
        </div>
      </header>

      <div id="scroll-container">
        <div class="chat-content">
          <section id="empty-state" aria-labelledby="aura-greeting">
            <div class="empty-mark" id="aura-state-orb" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 5.6v5.1M12 13.3v5.1M6.7 17.5 12 13.3M17.3 17.5 12 13.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                <circle cx="12" cy="4.6" r="1.9" fill="currentColor" /><circle cx="5.4" cy="18.6" r="1.9" fill="currentColor" /><circle cx="18.6" cy="18.6" r="1.9" fill="currentColor" /><circle cx="12" cy="12" r="1.6" fill="currentColor" />
              </svg>
            </div>
            <h1 id="aura-greeting">What can I help you with?</h1>
            <p class="empty-subtitle">Ask, create, learn, or work through an idea with Aura.</p>
            <div id="category-chips" aria-label="Suggested prompts"></div>
            <p id="empty-state-cta" class="hidden">Choose a prompt or start with your own question.</p>
          </section>

          <div id="chat-messages" aria-live="polite" aria-label="Conversation"></div>
        </div>
      </div>

      <div class="chat-composer-area">
        <div class="composer-wrap">
          <div id="chat-footer">
            <div id="attachment-preview-container" class="hidden" aria-label="Attachments"></div>
            <div id="text-input-bar">
              <input id="file-input" type="file" multiple accept=".txt,.json,.md,.csv,image/*" hidden />
              <button id="attach-btn" class="composer-button" type="button" aria-label="Attach files" title="Attach files">
                <span class="material-symbols-outlined">add</span>
              </button>
              <textarea id="chat-input" rows="1" maxlength="4000" placeholder="Message Aura…"></textarea>
              <button id="mic-btn" class="composer-button" type="button" aria-label="Use voice input" title="Use voice input">
                <span class="material-symbols-outlined">mic</span>
              </button>
              <button id="stop-btn" class="hidden" type="button" aria-label="Stop generating" title="Stop generating">
                <span class="material-symbols-outlined">stop</span>
              </button>
              <button id="send-btn" type="button" aria-label="Send message" title="Send message">
                <span class="material-symbols-outlined">arrow_upward</span>
              </button>
            </div>
          </div>
          <div class="composer-help">
            <span>Aura can make mistakes. Check important information.</span>
            <span id="char-counter">0 / 4000</span>
          </div>
        </div>
      </div>

      <button id="scroll-to-bottom-btn" type="button" aria-label="Scroll to latest message">
        <span class="material-symbols-outlined" style="font-size:18px">arrow_downward</span>
      </button>
    </main>
