  <!-- Cursor Glow (desktop only, hidden on mobile via CSS) -->
  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  <!-- Chat UI Upgrade Pack -->
  <script>
  (function() {
    // Cursor glow tracker
    const isMobile = window.matchMedia('(max-width: 767px)').matches;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!isMobile && !reducedMotion) {
      const glow = document.getElementById('cursor-glow');
      if (glow) {
        document.addEventListener('mousemove', (e) => {
          glow.style.left = e.clientX + 'px';
          glow.style.top  = e.clientY + 'px';
        }, { passive: true });
      }
    }

    // Send button ripple
    document.addEventListener('DOMContentLoaded', () => {
      const sendBtn = document.getElementById('send-btn');
      if (sendBtn) {
        sendBtn.addEventListener('click', function() {
          this.classList.remove('ripple');
          void this.offsetWidth;
          this.classList.add('ripple');
          setTimeout(() => this.classList.remove('ripple'), 500);
        });
      }

      // Greeting shimmer (Mitrooo heading) — only on desktop
      if (!isMobile && !reducedMotion) {
        const greeting = document.getElementById('aura-greeting');
        if (greeting) {
          greeting.style.background = 'linear-gradient(90deg, #f5f5f7 0%, #5ea2ff 30%, #a07cff 60%, #f5f5f7 100%)';
          greeting.style.backgroundSize = '300% auto';
          greeting.style.webkitBackgroundClip = 'text';
          greeting.style.backgroundClip = 'text';
          greeting.style.webkitTextFillColor = 'transparent';
          greeting.style.animation = 'hero-shimmer 5s linear infinite';
        }
      }

      // Drawer spring easing is handled via CSS
      // History item stagger is handled via CSS
    });
  })();
  </script>
